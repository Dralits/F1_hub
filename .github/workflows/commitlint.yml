name: Conventional Commits

on:
  push:

permissions:
  contents: read

jobs:
  commitlint:
    name: Check Conventional Commits
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
